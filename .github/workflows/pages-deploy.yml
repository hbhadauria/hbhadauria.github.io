name: Deploy GitHub Pages

# Manual production deploy by design. To auto-deploy on merge, add `push: { branches: [main] }`.
on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Enforce main branch deployment
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Production deployments must run from refs/heads/main (got ${{ github.ref }})."
          exit 1

      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck, build & search index
        run: npm run build
        env:
          ASTRO_TELEMETRY_DISABLED: "1"

      - name: Verify routes, links & hygiene
        run: npm run verify

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
