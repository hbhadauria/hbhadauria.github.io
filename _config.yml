# Import the theme
theme: jekyll-theme-chirpy

# -------------------------
# Site Settings
# -------------------------
lang: en
timezone: Asia/Kolkata

title: HSB Learnings
tagline: Solution Architect · .NET Specialist · AI Enthusiast
description: >-
  Sharing my journey through tech — Solution Architecture, .NET, AI-assisted development,
  cloud-native patterns, and more. Written by Harshit Bhadauria.

url: "https://hbhadauria.github.io"
baseurl: ""

# -------------------------
# Social & Author
# -------------------------
github:
  username: hbhadauria

twitter:
  username: iam_hbhadauria

social:
  name: Harshit Bhadauria
  email: ""
  links:
    - https://twitter.com/iam_hbhadauria
    - https://www.linkedin.com/in/harshitbhadauria/
    - https://github.com/hbhadauria

# -------------------------
# Appearance
# -------------------------
theme_mode: # [light | dark] — leave blank for system default (auto toggle)
avatar: "https://github.com/hbhadauria.png"

# -------------------------
# Analytics
# -------------------------
analytics:
  google:
    id: "G-BDV07GK68V"

# -------------------------
# Site Verification
# -------------------------
webmaster_verifications:
  google: # fill in your Google verification code

# -------------------------
# Theme & Sidebar
# -------------------------
toc: true

comments:
  provider: # [disqus | utterances | giscus]
  disqus:
    shortname:
  utterances:
    repo:
    issue_term:
  giscus:
    repo:
    repo_id:
    category:
    category_id:
    mapping:
    strict:
    input_position:
    lang:
    reactions_enabled:

pwa:
  enabled: true
  cache:
    enabled: true
    deny_paths:

paginate: 10

# -------------------------
# Kramdown
# -------------------------
kramdown:
  footnote_backlink: "&#8617;&#xfe0e;"
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: highlight
    span:
      line_numbers: false
    block:
      line_numbers: true
      start_line: 1

# -------------------------
# Collections
# -------------------------
collections:
  tabs:
    output: true
    sort_by: order

# -------------------------
# Defaults
# -------------------------
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      comments: true
      toc: true
      permalink: /posts/:title/

  - scope:
      path: _drafts
    values:
      comments: false

  - scope:
      path: ""
      type: tabs
    values:
      layout: page
      permalink: /:title/

# -------------------------
# Plugins
# NOTE: jekyll-feed, jekyll-sitemap, jekyll-seo-tag are bundled
# by the Chirpy theme gem — do not redeclare them here.
# -------------------------

# -------------------------
# Sass
# -------------------------
sass:
  style: compressed

# -------------------------
# Compression
# -------------------------
compress_html:
  clippings: all
  comments: all
  endings: all
  profile: false
  blanklines: false
  ignore:
    envs: [development]

# -------------------------
# Exclude from build
# -------------------------
exclude:
  - "*.gem"
  - "*.gemspec"
  - docs
  - tools
  - README.md
  - LICENSE
  - purgecss.js
  - "*.config.js"
  - "package*.json"

# -------------------------
# Jekyll Archives
# -------------------------
jekyll-archives:
  enabled: [categories, tags]
  layouts:
    category: category
    tag: tag
  permalinks:
    tag: /tags/:name/
    category: /categories/:name/
