# -------------------------
# Site Settings
# -------------------------
lang: en
timezone: Asia/Kolkata

title: HSB Learnings
tagline: Solution Architect · .NET Specialist · AI Enthusiast
description: >-
  Sharing my journey through tech — Solution Architecture, .NET, AI-assisted development,
  cloud-native patterns, and more. Written by Harshit Bhadauria.

url: "https://hbhadauria.github.io"
baseurl: ""

# -------------------------
# Social & Author
# -------------------------
github:
  username: hbhadauria

twitter:
  username: iam_hbhadauria

social:
  name: Harshit Bhadauria
  email: ""
  links:
    - https://twitter.com/iam_hbhadauria
    - https://www.linkedin.com/in/harshitbhadauria/
    - https://github.com/hbhadauria

# -------------------------
# Appearance
# -------------------------
theme_mode: # [light | dark] — leave blank for system default (auto toggle)
avatar: "https://github.com/hbhadauria.png"

# -------------------------
# SEO & Analytics
# -------------------------
google_analytics:
  id: "G-BDV07GK68V"

google_site_verification: # Add your GSC token here if you have one

seo_keywords:
  - .NET
  - solution architecture
  - AI development
  - Jekyll blog
  - mobile app development
  - cloud native

# -------------------------
# Theme & Sidebar
# -------------------------
toc: true                       # Table of contents on posts
comments:
  active: ""                    # Set to 'disqus', 'utterances', or 'giscus' to enable
  disqus:
    shortname: ""
  utterances:
    repo: ""
    issue_term: ""
  giscus:
    repo: ""
    repo_id: ""
    category: ""
    category_id: ""
    mapping: ""
    input_position: ""
    lang: ""
    reactions_enabled: ""

paginate: 10

# -------------------------
# Collections / Defaults
# -------------------------
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      comments: false
      toc: true
      math: false
      mermaid: false

  - scope:
      path: _drafts
    values:
      comments: false

  - scope:
      path: ""
      type: tabs
    values:
      layout: page
      permalink: /:title/

# -------------------------
# Plugins
# NOTE: jekyll-feed, jekyll-sitemap, jekyll-seo-tag are bundled
# by the Chirpy theme gem — do not redeclare them here.
# -------------------------

# -------------------------
# Sass
# -------------------------
sass:
  style: compressed

# -------------------------
# Compression
# -------------------------
compress_html:
  clippings: all
  comments: all
  endings: all
  profile: false
  blanklines: false
  ignore:
    envs: [development]

# -------------------------
# Exclude from build
# -------------------------
exclude:
  - "*.gem"
  - "*.gemspec"
  - docs
  - tools
  - README.md
  - LICENSE
  - "*.config.js"
  - package*.json
  - rollup.config.js
  - node_modules
  - Gruntfile.js
